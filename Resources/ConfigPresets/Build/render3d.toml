# Configuration preset for the 3D view (docs/ss12/README.md). Generated by the SS12 installer.
# Forces the 3D view on for living players (set enforced = false to let players choose) and keeps WASD camera-relative.

[render3d]
enforced = false

[physics]
relative_movement = true

[shuttle]
# The 90 degree camera rotate keys are meaningless in 3D; yaw comes from mouse-look.
camera_rotation_locked = true
